{{define "admin_media_viewer"}}
{{template "head" .}}
<main class="admin-media-viewer" id="main-content">
  <div class="ui-toolbar ui-toolbar--plain"><a class="button ghost admin-media-back" href="/admin/content">К AI-контенту</a>{{template "theme_picker" .}}</div>
  <section class="admin-media-frame">
    <header><div><p class="section-kicker">AI-контент</p><h1>{{.Filename}}</h1></div><a class="button" href="/admin/content/media/{{.MediaID}}?raw=1&amp;download=1" download>Скачать оригинал</a></header>
    {{if eq .MediaType "video"}}<video controls playsinline preload="auto" src="/admin/content/media/{{.MediaID}}?raw=1"></video>{{else}}<img src="/admin/content/media/{{.MediaID}}?raw=1" alt="Результат AI-генерации">{{end}}
  </section>
</main>
</body></html>
{{end}}
