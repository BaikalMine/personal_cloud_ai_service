{{define "studio_qwen_loras"}}
{{$root := .}}
<section class="workflow-settings-section qwen-lora-settings" hidden>
  <div class="workflow-settings-heading"><strong>Qwen Image 2.1 · LoRA</strong></div>
  {{if .QwenLoraGroups}}
  <div class="lora-stack">
    {{range $root.QwenLoraSlots}}
    <div class="ui-field-grid lora-row flux-lora-row" data-lora-slots="qwen21" {{if ne . 1}}hidden{{end}}>
      <span class="lora-number">{{.}}</span>
      <label class="ui-field"><span class="ui-field-label">LoRA</span><select name="lora_{{.}}" class="generation-lora-select"><option value="">Без LoRA</option>{{range $root.QwenLoraGroups}}<optgroup label="{{.Name}}">{{range .Loras}}<option value="{{.Name}}" data-default-strength="{{.DefaultStrength}}">{{.DisplayName}}</option>{{end}}</optgroup>{{end}}</select></label>
      <label class="ui-field"><span class="ui-field-label">Сила</span><input name="lora_model_strength_{{.}}" class="generation-lora-model" type="number" min="-100" max="100" step="0.01" value="0"></label>
    </div>
    {{end}}
  </div>
  {{else}}<p class="muted">LoRA для Qwen Image 2.1 не установлены.</p>{{end}}
</section>
{{end}}
