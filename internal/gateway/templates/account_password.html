{{define "account_password"}}
{{template "head" .}}
{{template "nav" .}}
<main class="page" id="main-content">
  <section class="hero"><div><p class="eyebrow">Аккаунт</p><h1>Смена пароля</h1></div></section>
  <section class="panel narrow form-panel">
    <div class="panel-heading"><div><p class="section-kicker">Безопасность аккаунта</p><h2>Новый пароль</h2></div></div>
    {{if .Error}}<p class="alert">{{.Error}}</p>{{end}}
    {{if .Success}}<p class="success-box">{{.Success}}</p>{{end}}
    <form method="post">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <label>Текущий пароль<input name="current_password" type="password" autocomplete="current-password" required></label>
      <label>Новый пароль<input name="new_password" type="password" autocomplete="new-password" required minlength="10"></label>
      <label>Повторите новый пароль<input name="confirm_password" type="password" autocomplete="new-password" required minlength="10"></label>
      <button type="submit">Сохранить новый пароль</button>
    </form>
  </section>
</main>
</body></html>
{{end}}
