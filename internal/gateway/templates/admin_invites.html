{{define "admin_invites"}}
{{template "head" .}}
{{template "admin_nav" .}}
<main class="page" id="main-content">
  <section class="hero invite-hero">
    <div><p class="eyebrow">Управление доступом</p><h1>Приглашения</h1></div>
  </section>

  {{if .InviteLink}}
  <section class="panel success invite-result ui-status-banner is-success" aria-live="polite">
    <div class="panel-heading"><div><p class="section-kicker">Готово</p><h2>Ссылка-приглашение создана</h2></div></div>
    <div class="copyrow"><p class="copyline" id="invite-link">{{.InviteLink}}</p><button class="ghost" type="button" data-copy-target="#invite-link">Копировать ссылку</button></div>
  </section>
  {{end}}

  {{template "invite_composer" .}}

  {{template "access_invitation_list" .}}
</main>
</body></html>
{{end}}
