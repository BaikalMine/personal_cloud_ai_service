services:
  app:
    environment:
      MINING_FENCED_COMMANDS: 'true'
      HARNESS_UPSTREAM: http://harness:3080
      HARNESS_BOOTSTRAP_URL: http://harness:3082
      HARNESS_MODEL_UPSTREAM: ${HARNESS_NATIVE_API_URL:?required}
      HARNESS_BOOTSTRAP_KEY: ${HARNESS_BOOTSTRAP_KEY:?required}
      HARNESS_MODEL_KEY: ${HARNESS_MODEL_KEY:?required}
      HARNESS_CLIENT_KEY: ${HARNESS_CLIENT_KEY:?required}
      HARNESS_ADMISSION_KEY: ${HARNESS_ADMISSION_KEY:?required}
    networks:
      harness-private:
        aliases: [gateway-harness]
  harness:
    image: ai-gateway-harness:0.2.1-alpha.2
    container_name: ai-gateway-harness
    init: true
    user: '1000:1000'
    environment:
      HARNESS_PUBLIC_URL: ${PUBLIC_BASE_URL}/harness/
      HARNESS_TRUSTED_HOSTS: ${HARNESS_TRUSTED_HOSTS:?required}
      HARNESS_BOOTSTRAP_KEY: ${HARNESS_BOOTSTRAP_KEY:?required}
      HARNESS_MODEL_KEY: ${HARNESS_MODEL_KEY:?required}
      HARNESS_MODEL_URL: http://gateway-harness:8090/internal/harness/v1
      HARNESS_MODELS: ${HARNESS_MODELS:?required}
    networks: [harness-private]
    volumes:
      - harness-data:/data
      - harness-workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=256m,uid=1000,gid=1000
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', 'const a=Object.values(require("os").networkInterfaces()).flat().find(x=>x.family==="IPv4"&&!x.internal).address;fetch(`http://$${a}:3082/healthz`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  harness-data:
  harness-workspace:
networks:
  harness-private:
    internal: true
